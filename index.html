<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SimAdmin 多设备管理</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300d2ff'/%3E%3Cstop offset='1' stop-color='%233a7bd5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M20 44 L32 16 L44 44' stroke='white' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M26 53 h12' stroke='white' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0d1117; --bg-2: #161b22; --bg-3: #1c2333;
            --panel: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.08);
            --border-soft: rgba(255, 255, 255, 0.04);
            --text: #e6edf3; --muted: #8b949e;
            --accent: #00d2ff; --accent-2: #3a7bd5;
            --green: #3fb950; --red: #f85149; --yellow: #d29922;
            --radius: 12px;
        }
        /* 亮色主题（手动切换，localStorage 记忆） */
        html[data-theme="light"] {
            --bg: #f2f4f8; --bg-2: #ffffff; --bg-3: #e8ecf2;
            --panel: rgba(15, 23, 42, 0.04); --border: rgba(15, 23, 42, 0.12);
            --border-soft: rgba(15, 23, 42, 0.07);
            --text: #1f2328; --muted: #57606a;
            --accent: #0088cc; --accent-2: #2f6fae;
            --green: #1a7f37; --red: #cf222e; --yellow: #9a6700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 全局平滑过渡：主题切换时颜色/背景/边框自然渐变（0.4s），不闪眼 */
        *, *::before, *::after {
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text); min-height: 100vh; padding: 20px;
        }
        /* 尊重系统"减少动画"偏好：直接切换 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
        .container { max-width: 1500px; margin: 0 auto; }

        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 42px; height: 42px; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; box-shadow: 0 4px 16px rgba(0, 210, 255, 0.3);
        }
        .brand h1 { font-size: 1.3rem; font-weight: 600; }
        .brand p { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
        .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .btn {
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s ease; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: var(--panel); border-color: var(--accent); }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 210, 255, 0.35); }
        /* 快捷控制开关 */
        .ctrl-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding: 10px 12px; background: var(--bg2); border-radius: 8px; }
        .ctrl-group .ctrl-label { width: 100%; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
        .ctrl-item { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg); border-radius: 20px; border: 1px solid var(--border); cursor: pointer; user-select: none; font-size: 0.72rem; }
        .ctrl-item:hover { border-color: var(--accent); }
        .ctrl-item.on { background: var(--accent); color: #fff; border-color: var(--accent); }
        .ctrl-item.off { opacity: 0.6; }
        .ctrl-item .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .ctrl-item.on .dot { background: #fff; }
        .ctrl-item.off .dot { background: var(--muted); }
        .ctrl-item.loading { opacity: 0.5; pointer-events: none; }
        .ctrl-btn { padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 0.72rem; }
        .ctrl-btn:hover { border-color: var(--accent); background: var(--panel); }
        .ctrl-btn.danger { border-color: var(--red); color: var(--red); }
        .ctrl-btn.danger:hover { background: var(--red); color: #fff; }
        .btn-danger { border-color: rgba(248, 81, 73, 0.4); color: var(--red); }
        .btn-danger:hover { background: rgba(248, 81, 73, 0.15); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* 短信按钮未读状态 */
        .btn-sms-unread {
            border-color: rgba(248, 81, 73, 0.55);
            background: rgba(248, 81, 73, 0.12);
            color: var(--red);
            animation: badgePulse 1.5s infinite;
        }
        .sms-badge-num {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 10px;
            background: var(--red); color: #fff; font-size: 0.7rem;
        }
        @keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat-card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 9px 14px; transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: rgba(0, 210, 255, 0.3); transform: translateY(-2px); }
        .stat-label { color: var(--muted); font-size: 0.73rem; margin-bottom: 2px; }
        .stat-value { font-size: 1.25rem; font-weight: 700; line-height: 1.1; }
        .stat-sub { color: var(--muted); font-size: 0.7rem; margin-top: 1px; }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.yellow { color: var(--yellow); }
        .stat-value.accent { color: var(--accent); }

        .section-title { font-size: 1rem; font-weight: 600; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }
        .section-title .hint { font-size: 0.75rem; color: var(--muted); font-weight: 400; }

        /* ===== 设备卡片网格 ===== */
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .device-card {
            background: var(--bg-2); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; transition: all 0.25s ease;
        }
        .device-card:hover { border-color: rgba(0, 210, 255, 0.35); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .device-card.error-card { border-color: rgba(248, 81, 73, 0.5); }
        .device-card.error-card:hover { border-color: var(--red); }

        .dev-head { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-bottom: 1px solid var(--border); }
        .dev-avatar {
            width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
            background: rgba(0, 210, 255, 0.12);
        }
        .dev-avatar.offline { background: rgba(139, 148, 158, 0.12); filter: grayscale(1); }
        .dev-avatar.error { background: rgba(248, 81, 73, 0.12); }
        /* 运营商 logo */
        .dev-avatar.carrier-mobile    { background: #ffffff !important; }
        .dev-avatar.carrier-unicom    { background: #ffffff !important; }
        .dev-avatar.carrier-telecom   { background: #ffffff !important; }
        .dev-avatar.carrier-broadcast { background: #E60012 !important; }
        .carrier-logo-img { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; }
        .carrier-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.82rem; font-weight: 700; }
        /* 摘要行内的小型状态芯片 */
        .s-volte, .s-net { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; }
        .s-volte.on   { background: rgba(63, 185, 80, 0.15); color: var(--green); }
        .s-volte.off  { background: rgba(139, 148, 158, 0.15); color: var(--muted); }
        .s-volte.warn { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
        .s-volte.muted { background: rgba(139, 148, 158, 0.12); color: var(--muted); }
        .s-net.s-cellular { background: rgba(0, 210, 255, 0.15); color: var(--accent); }
        .s-net.s-wifi { background: rgba(63, 185, 80, 0.15); color: var(--green); }
        .s-net.s-off  { background: rgba(248, 81, 73, 0.15); color: var(--red); }
        .dev-name { font-weight: 600; font-size: 0.87rem; }
        .dev-url { color: var(--muted); font-size: 0.7rem; font-family: Consolas, monospace; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dev-status { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }
        .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; }
        .status-online { background: rgba(63, 185, 80, 0.15); color: var(--green); }
        .status-online::before { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
        .status-offline { background: rgba(139, 148, 158, 0.15); color: var(--muted); }
        .status-offline::before { background: var(--muted); }
        .status-error { background: rgba(248, 81, 73, 0.15); color: var(--red); }
        .status-error::before { background: var(--red); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .dev-body { padding: 12px 14px; }
        .kv-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.83rem; }
        .kv-row:last-child { border-bottom: none; }
        .kv-row .k { color: var(--muted); }
        .kv-row .v { text-align: right; font-weight: 500; }
        .kv-row .v.mono { font-family: Consolas, monospace; font-size: 0.78rem; }

        .signal-disp { display: inline-flex; align-items: center; gap: 8px; }
        .signal-bars { display: inline-flex; gap: 3px; align-items: flex-end; }
        .signal-bars span { width: 4px; border-radius: 1px; background: var(--border); }
        .signal-bars span.on { background: var(--accent); }
        .signal-strong { color: var(--green); }
        .signal-mid { color: var(--yellow); }
        .signal-weak { color: var(--red); }

        .meter { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .meter > div { height: 100%; border-radius: 3px; transition: width 0.5s; }
        .meter.cpu > div { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
        .meter.mem > div { background: linear-gradient(90deg, #f0883e, #f85149); }

        .dev-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); }
        .dev-actions .btn { flex: 1; justify-content: center; font-size: 0.8rem; padding: 7px 10px; }

        /* 卡片式：默认收起，点击头部展开显示具体数据 */
        .dev-head { cursor: pointer; user-select: none; }
        .device-card:not(.expanded) .dev-body,
        .device-card:not(.expanded) .dev-actions { display: none; }
        .device-card.expanded .dev-actions { display: flex; }

        .dev-id { min-width: 0; }
        .dev-summary {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            margin-top: 4px; font-size: 0.72rem; color: var(--muted);
        }
        .dev-summary .s-op { color: var(--text); font-weight: 500; }
        .dev-summary .s-sep { opacity: 0.35; }
        .dev-summary .s-unread {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(0, 210, 255, 0.15); color: var(--accent);
            padding: 1px 8px; border-radius: 12px; font-weight: 600; font-size: 0.72rem;
        }
        .dev-summary .s-roam {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(210, 153, 34, 0.15); color: var(--yellow);
            padding: 1px 8px; border-radius: 12px; font-size: 0.72rem;
        }
        .dev-chevron { transition: transform 0.2s ease; color: var(--muted); font-size: 0.9rem; margin-left: 6px; flex-shrink: 0; }
        .device-card:not(.expanded) .dev-chevron { transform: rotate(-90deg); }

        /* OTA 更新提示条 */
        .ota-banner {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: rgba(210, 153, 34, 0.15); border: 1px solid rgba(210, 153, 34, 0.4);
            color: var(--yellow); border-radius: 8px; padding: 8px 12px;
            font-size: 0.78rem; margin-bottom: 10px;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state .big { font-size: 3rem; margin-bottom: 14px; }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px;
            width: min(520px, 92vw); padding: 24px; max-height: 88vh; overflow-y: auto;
        }
        .modal h2 { font-size: 1.05rem; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--panel); color: var(--text);
            outline: none; font-size: 0.88rem; transition: border 0.2s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .form-group .tip { color: var(--muted); font-size: 0.72rem; margin-top: 4px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }
        .form-actions .btn { flex: 1; justify-content: center; }

        .device-list-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
            font-size: 0.82rem;
        }
        .device-list-item .name { font-weight: 500; }
        .device-list-item .addr { color: var(--muted); font-family: Consolas, monospace; font-size: 0.75rem; }
        .device-list-item .actions { margin-left: auto; display: flex; gap: 6px; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--bg-3); border: 1px solid var(--border); color: var(--text);
            padding: 12px 24px; border-radius: 10px; font-size: 0.85rem; z-index: 200;
            opacity: 0; transition: all 0.3s; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            max-width: 80vw;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .refresh-indicator { font-size: 0.75rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
        .spin-icon { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 短信弹窗 ===== */
        .sms-list { max-height: 380px; overflow-y: auto; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
        .sms-msg { display: flex; margin-bottom: 10px; }
        .sms-msg .bubble { max-width: 80%; padding: 9px 12px; border-radius: 12px; font-size: 0.83rem; line-height: 1.5; word-break: break-word; }
        .sms-msg.incoming .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .sms-msg.outgoing { justify-content: flex-end; }
        .sms-msg.outgoing .bubble { background: rgba(0, 210, 255, 0.15); border: 1px solid rgba(0, 210, 255, 0.25); border-bottom-right-radius: 4px; }
        .sms-msg .meta { display: flex; gap: 8px; margin-bottom: 3px; font-size: 0.7rem; color: var(--muted); }
        .sms-msg .meta .num { font-weight: 600; color: var(--text); }
        .sms-msg.incoming.unread .bubble { border: 1px solid rgba(0, 210, 255, 0.5); box-shadow: 0 0 8px rgba(0, 210, 255, 0.15); }
        .sms-empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 0.85rem; }
        .sms-reply-box { display: flex; gap: 8px; }
        .sms-reply-box input, .sms-reply-box textarea {
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); padding: 9px 11px; font-size: 0.83rem; outline: none;
        }
        .sms-reply-box input:focus, .sms-reply-box textarea:focus { border-color: var(--accent); }
        .sms-reply-box input { width: 130px; flex-shrink: 0; }
        .sms-reply-box textarea { flex: 1; resize: vertical; min-height: 40px; font-family: inherit; }
        .sms-reply-box .btn { align-self: stretch; }

        @media (max-width: 768px) {
            .device-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部栏 -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">📡</div>
                <div>
                    <h1>SimAdmin 多设备管理</h1>
                    <p>Multi-device Console · 聚合管理所有 SimAdmin 设备</p>
                </div>
            </div>
            <div class="topbar-actions">
                <span class="refresh-indicator" id="refreshIndicator"></span>
                <select id="refreshMode" class="btn" onchange="onRefreshModeChange()" title="刷新模式（数据从数据库读取，低延迟）">
                    <option value="5">5秒自动刷新</option>
                    <option value="30" selected>30秒自动刷新</option>
                    <option value="0">手动刷新</option>
                </select>
                <button class="btn" id="themeToggle" onclick="toggleTheme()" title="切换白天/黑夜模式">🌙 夜间</button>
                <button class="btn" onclick="refreshAll()">🔄 刷新全部</button>
                <button class="btn" onclick="openManageDevices()">⚙️ 管理设备</button>
                <button class="btn btn-primary" onclick="openAddDevice()">＋ 添加设备</button>
            </div>
        </header>

        <!-- 统计卡片 -->
        <section class="stats-grid" id="statsGrid"></section>

        <!-- 设备网格 -->
        <div class="section-title">
            <span>📱 设备列表</span>
            <span class="hint" id="listHint"></span>
        </div>
        <div class="device-grid" id="deviceGrid"></div>
    </div>

    <!-- 添加设备弹窗 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>＋ 添加 SimAdmin 设备</h2>
            <div class="form-group">
                <label>设备名称</label>
                <input type="text" id="addName" placeholder="如：客厅随身WiFi">
            </div>
            <div class="form-group">
                <label>设备 IP 地址</label>
                <input type="text" id="addIp" placeholder="192.168.68.1">
                <div class="tip">默认补全为 http://{IP}:3000，可带端口如 192.168.68.1:8080</div>
            </div>
            <div class="form-group">
                <label>管理员密码（可选）</label>
                <input type="password" id="addPassword" placeholder="设备管理员密码，留空表示未开启验证">
                <div class="tip">留空 = 该 SimAdmin 未开启密码验证，代理直连无需鉴权；填写 = 开启密码验证，代理登录获取会话</div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="confirmAddDevice()">添加</button>
                <button class="btn" onclick="closeModal('addModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 管理设备弹窗 -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal">
            <h2>⚙️ 管理设备列表</h2>
            <div id="manageList"></div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('manageModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 主密码弹窗（首次设置 / 未授权时输入） -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="authTitle">🔒 访问密码</h2>
            <div id="authTip" class="tip" style="margin-bottom:12px"></div>
            <div class="form-group">
                <label id="authLabel">输入访问密码</label>
                <input type="password" id="authInput" placeholder="访问密码" autocomplete="off">
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="submitAuth()">确认</button>
            </div>
        </div>

    <!-- 短信弹窗 -->
    <div class="modal-overlay" id="smsModal">
        <div class="modal" style="width:min(640px,94vw)">
            <h2 id="smsTitle">💬 短信</h2>
            <div id="smsBody" style="min-height:200px"></div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('smsModal')">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        'use strict';
        // 带超时包装：任何请求最多等 ms 毫秒，避免后端（单线程 PHP）偶发卡住时前端永久白屏/卡死
        function fetchWithTimeout(url, opts, ms) {
            ms = ms || 12000;
            const ctrl = new AbortController();
            const t = setTimeout(function () { ctrl.abort(); }, ms);
            opts = opts || {};
            opts.signal = ctrl.signal;
            return fetch(url, opts).finally(function () { clearTimeout(t); });
        }

        // ===== 版本戳 + 自动强刷（服务端为唯一版本源，杜绝前后端版本漂移导致的无限刷新）=====
        // 版本号由 api.php 基于 index.html 的文件修改时间动态生成：每次上传新 HTML，mtime 变化
        // → 版本号变化 → 浏览器检测到 localStorage 记录与服务端不一致即自动强刷。无需手动改版本号，永不漂移。
        (function autoReload() {
            fetch('api.php?action=version&_=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    if (j && j.data && j.data.version) {
                        const v = j.data.version;
                        const stored = localStorage.getItem('sg_app_ver');
                        if (stored === null) {
                            localStorage.setItem('sg_app_ver', v); // 首次访问直接记住，不刷新
                        } else if (stored !== v) {
                            localStorage.setItem('sg_app_ver', v);
                            location.reload(true); // 版本变化（部署新 HTML）才强刷
                        }
                    }
                })
                .catch(function () {});
        })();

        // ===== 主题（白天/黑夜，localStorage 记忆） =====
        const THEME_KEY = 'simadmin_theme';
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const btn = $('themeToggle');
            if (btn) btn.textContent = theme === 'light' ? '🌙 夜间' : '☀️ 白天';
        }
        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            applyTheme(cur === 'light' ? 'dark' : 'light');
        }
        // 初始化主题（默认黑夜，跟随记忆）
        applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');

        // ===== 配置存储 =====
        const STORAGE_KEY = 'simadmin_multi_devices'; // 保留 key 避免旧数据干扰（已不再读写）
        const SMS_SEEN_KEY = 'simadmin_sms_seen';
        // URL 带 ?reset=1 时清空已读记录（模拟"来新短信"，用于体验未读提醒）
        if (new URLSearchParams(location.search).has('reset')) {
            localStorage.removeItem(SMS_SEEN_KEY);
            history.replaceState(null, '', location.pathname);
        }
        // 设备配置以服务器为准（后端 data/devices.json 是唯一数据源，不读 localStorage）
        let devices = [];
        function saveDevices() {
            const slim = devices.map(d => ({ id: d.id, name: d.name, url: d.url, password: d.password }));
            // 只写服务器（后端 data/devices.json 是唯一数据源，跨设备共享）
            // 返回 fetch promise，便于调用方 await，避免删除+重加时后端 devices 表的并发竞态
            return fetch('api.php?action=devices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ devices: slim, ...(accessPassword ? { access_password: accessPassword } : {}) })
            }).catch(() => {});
        }

        // 启动时从服务器拉取设备配置（服务器是唯一数据源）
        async function syncDevicesFromServer() {
            try {
                const res = await fetchWithTimeout('api.php?action=devices' + (accessPassword ? '&access_password=' + encodeURIComponent(accessPassword) : ''));
                const json = await res.json().catch(() => null);
                if (json && json.status === 'error' && json.data && json.data.need_auth) {
                    throw new Error('NEED_AUTH');
                }
                const serverList = (json && json.status === 'ok' && Array.isArray(json.data)) ? json.data : [];
                // 合并而非整体覆盖：避免「页面加载时异步拉取设备列表」在用户已添加设备后才返回，
                // 用较旧的服务端列表整体覆盖掉刚添加的设备（表现为「添加设备后刷新，设备消失/报错」）。
                const existing = new Set(devices.map(d => d.id));
                serverList.forEach(d => {
                    if (!existing.has(d.id)) {
                        devices.push({ ...d, data: null, error: null, loading: false, lastUpdate: null, smsMsgs: [] });
                    }
                });
                return serverList.length > 0;
            } catch (e) { /* 服务器不可用时保持空列表 */ }
            return false;
        }

        // IP → 完整 URL（默认补 http:// 和 :3000）
        function normalizeUrl(input) {
            let s = String(input || '').trim();
            if (!s) return '';
            if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
            const u = new URL(s);
            if (!u.port && u.protocol === 'http:') u.port = '3000';
            return u.toString().replace(/\/+$/, '');
        }

        // ===== 工具 =====
        function $(id) { return document.getElementById(id); }
        function esc(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = String(s);
            return d.innerHTML;
        }
        let toastTimer = null;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
        }
        function fmtBytes(b) {
            if (b == null) return '—';
            if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
            return b + ' B';
        }
        function fmtUptime(seconds) {
            if (!seconds) return '—';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (d > 0) return `${d}天 ${h}小时`;
            if (h > 0) return `${h}小时 ${m}分`;
            return `${m}分`;
        }
        function signalClass(v) {
            if (v >= 70) return 'signal-strong';
            if (v >= 40) return 'signal-mid';
            return 'signal-weak';
        }
        function signalBars(pct) {
            if (pct == null) return '<span style="color:var(--muted)">—</span>';
            const bars = pct >= 70 ? 4 : pct >= 40 ? 3 : pct >= 20 ? 2 : 1;
            let html = `<span class="signal-disp"><span class="signal-bars">`;
            for (let i = 1; i <= 4; i++) html += `<span style="height:${4 + i * 3}px" class="${i <= bars ? 'on' : ''}"></span>`;
            html += `</span><span class="${signalClass(pct)}">${pct}%</span></span>`;
            return html;
        }

        // 注册状态英文 → 中文（与 SimAdmin 后端 registration_label 一致）
        function regLabel(value) {
            const v = String(value || '').trim().toLowerCase();
            switch (v) {
                case 'registered': case 'home': return '已注册';
                case 'roaming': return '已注册（漫游）';
                case 'searching': return '搜索中';
                case 'denied': return '被拒绝';
                case 'idle': return '空闲';
                case '': return '—';
                default: return String(value);
            }
        }

        // VoLTE 状态徽章配色：
        //   绿色 = 注册成功（registered）
        //   黄色 = 启动中 / 停止中 / 等待连接 / 搜索重试等中间态
        //   红色 = 未连接 / 连接失败 / 功能未开启
        //   灰色 = 固件无此接口（旧版）
        function volteBadge(dev, volte) {
            // 接口返回错误/404/空 → 固件不支持
            if (volte == null || typeof volte !== 'object' || volte.status === 'error' || !volte.runtime) {
                return '<span style="color:var(--muted)">固件不支持</span>';
            }
            const runtime = volte.runtime || {};
            const reg = (runtime.phase || runtime.stage || '').toLowerCase();
            // 绿色：注册成功
            if (runtime.registered || reg === 'registered') {
                return `<span class="status-badge status-online">📶 VoLTE 成功 · ${esc(runtime.registration_mode || '')}</span>`;
            }
            // 红色：功能未开启
            if (volte.feature_enabled === false) {
                return '<span class="status-badge status-error">📶 VoLTE 功能未开启</span>';
            }
            // 黄色：中间态（启动/停止/等待连接/搜索/重试）
            if (/starting|stopping|searching|retrying|initializing|enabling|disabling|waiting|connecting|pending|registering/.test(reg)) {
                const label = reg === 'stopping' ? '停止中'
                    : reg === 'waiting' || reg === 'connecting' || reg === 'registering' ? '等待连接'
                    : reg === 'searching' || reg === 'retrying' ? '搜索重试中'
                    : '启动中';
                return `<span class="status-badge status-warning">📶 VoLTE ${label}</span>`;
            }
            // 红色：未连接 / 连接失败 / 其他未知状态
            return '<span class="status-badge status-error">📶 VoLTE 未连接</span>';
        }


        // 卡片摘要用的紧凑 VoLTE 指示
        function volteShort(volte) {
            if (volte == null || typeof volte !== 'object' || volte.status === 'error' || !volte.runtime) {
                return '<span class="s-volte muted">VoLTE —</span>';
            }
            const runtime = volte.runtime || {};
            const reg = String(runtime.phase || runtime.stage || '').toLowerCase();
            if (runtime.registered || reg === 'registered') return '<span class="s-volte on">📶 VoLTE</span>';
            if (volte.feature_enabled === false) return '<span class="s-volte off">📶 VoLTE 关</span>';
            if (/starting|stopping|searching|retrying|initializing|enabling|disabling|waiting|connecting|pending|registering/.test(reg))
                return '<span class="s-volte warn">📶 VoLTE</span>';
            return '<span class="s-volte off">📶 VoLTE 关</span>';
        }

        // 卡片摘要用的联网方式（WiFi 优先 > 数据流量 > 无网络）
        function connChip(d) {
            if (!d) return null;
            const ifaces = (d.stats && d.stats.network_speed && d.stats.network_speed.interfaces) || [];
            const wlan = ifaces.filter(i => String(i.interface || '').indexOf('wlan') !== -1);
            // 「连了 WiFi」判定：wlan 接口存在且有流量（总流量>0 或实时有收发）
            const hasWlan = wlan.some(i =>
                (i.total_rx_bytes || 0) > 0 || (i.total_tx_bytes || 0) > 0 ||
                (i.rx_bytes_per_sec || 0) > 0 || (i.tx_bytes_per_sec || 0) > 0);
            const cellular = !!(d.dataConn && d.dataConn.active);
            // 优先级：WiFi 最高，连了 WiFi 就显示 WiFi，否则才显示数据流量
            if (hasWlan)  return '<span class="s-net s-wifi">📶 WiFi</span>';
            if (cellular) return '<span class="s-net s-cellular">📡 数据流量</span>';
            return '<span class="s-net s-off">⚠ 无网络</span>';
        }

        function carrierInfo(d) {
            if (!d) return null;
            const net = d.network || {};
            const mnc = String(net.mnc != null ? net.mnc : '').trim();
            const opName = String(net.operator_name || net.operator || '').toLowerCase();
            const broadcastKeys = ['广电', '广播', 'cable', 'cbn', 'china broadcast', 'broadcast'];
            const tbl = {
                mobile:    { name: '中国移动', ch: '中', cls: 'carrier-mobile',    mncs: ['00','02','04','07'] },
                unicom:    { name: '中国联通', ch: '联', cls: 'carrier-unicom',    mncs: ['01','06','09'] },
                telecom:   { name: '中国电信', ch: '电', cls: 'carrier-telecom',   mncs: ['03','05','11'] },
                broadcast: { name: '中国广电', ch: '广', cls: 'carrier-broadcast', mncs: [] },
            };
            if (mnc) {
                for (const k in tbl) {
                    if (tbl[k].mncs && tbl[k].mncs.indexOf(mnc) !== -1) return tbl[k];
                }
            }
            if (opName) {
                if (broadcastKeys.some(k => opName.indexOf(k) !== -1)) return tbl.broadcast;
                if (opName.indexOf('mobile') !== -1 || opName.indexOf('移动') !== -1) return tbl.mobile;
                if (opName.indexOf('unicom') !== -1 || opName.indexOf('联通') !== -1) return tbl.unicom;
                if (opName.indexOf('telecom') !== -1 || opName.indexOf('电信') !== -1) return tbl.telecom;
            }
            return null;
        }
        function carrierLogo(c) {
            if (!c) return '';
            if (c.cls === 'carrier-telecom') {
                return '<img class="carrier-logo-img" src="data:image/jpeg;base64,' + TELECOM_LOGO_B64 + '" alt="中国电信">';
            }
            if (c.cls === 'carrier-unicom') {
                return '<img class="carrier-logo-img" src="data:image/jpeg;base64,' + UNICOM_LOGO_B64 + '" alt="中国联通">';
            }
            if (c.cls === 'carrier-mobile') {
                return '<img class="carrier-logo-img" src="data:image/jpeg;base64,' + MOBILE_LOGO_B64 + '" alt="中国移动">';
            }
            // 广电：无现成图片素材，用品牌色圆形徽标
            if (c.cls === 'carrier-broadcast') {
                return '<span class="carrier-badge" style="background:#E60012">广</span>';
            }
            return '';
        }

        // ===== SimAdmin API 调用（经本地 PHP 代理） =====
        // 主密码：sessionStorage 保存（关标签页后需重新输入），所有请求自动附带
        let accessPassword = sessionStorage.getItem('simadmin_access_pw') || '';
        function setAccessPassword(pw) {
            accessPassword = pw;
            if (pw) sessionStorage.setItem('simadmin_access_pw', pw);
            else sessionStorage.removeItem('simadmin_access_pw');
        }
        async function apiCall(action, params = {}) {
            const url = 'api.php?action=' + action;
            const body = { ...params };
            if (accessPassword) body.access_password = accessPassword;
            // 统一超时：任何请求最多 15s，避免后端（单线程 PHP）偶发卡住时前端永久白屏/卡死
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 15000);
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: ctrl.signal
                });
                const json = await res.json().catch(() => null);
                if (json && json.status === 'error' && json.data && json.data.need_auth) {
                    throw new Error('NEED_AUTH');
                }
                if (!res.ok || !json || json.status !== 'ok') {
                    throw new Error((json && json.message) || '请求失败 (HTTP ' + res.status + ')');
                }
                return json.data;
            } finally {
                clearTimeout(timer);
            }
        }
        async function apiGet(dev, path) {
            const url = 'api.php?action=status&url=' + encodeURIComponent(dev.url) + '&path=' + encodeURIComponent(path) + (accessPassword ? '&access_password=' + encodeURIComponent(accessPassword) : '');
            const res = await fetch(url);
            const json = await res.json().catch(() => null);
            if (json && json.status === 'error' && json.data && json.data.need_auth) {
                throw new Error('NEED_AUTH');
            }
            return json && json.data !== undefined ? json.data : json;
        }
        async function apiLogin(dev) {
            await apiCall('login', { url: dev.url, password: dev.password });
        }

        // ===== 拉取设备数据（走后端数据库缓存，低延迟） =====
        // 后端 ?action=refresh 抓取全部设备写库；?action=data 从库读（ttl 控制回源频率）。
        // 短信(SMS)仍由独立 10 秒轮询直连设备（逻辑不变）。

        // 将后端返回的结果映射到内存设备对象
        function applyServerData(result) {
            if (!result || typeof result !== 'object') return;
            devices.forEach(d => {
                const r = result[d.id];
                if (!r) return;
                if (r.ok && r.data) {
                    d.data = r.data;
                    d.error = null;
                    d.offline = false;
                    d.lastUpdate = r.updated_at ? new Date(r.updated_at * 1000) : new Date();
                    // 低延迟短信：优先用后端缓存（poller 每 5 秒刷新）；
                    // 若该设备短信弹窗正打开则保留本地数据，避免覆盖刚发出的气泡
                    if (r.data.sms && Array.isArray(r.data.sms) &&
                        !(smsDevId === d.id && $('smsModal').classList.contains('active'))) {
                        d.smsMsgs = r.data.sms;
                    }
                } else if (r.offline) {
                    // 方案 B：设备离线，后端已清理缓存；前端标记离线且不残留旧数据
                    d.offline = true;
                    d.data = null;
                    d.error = null;
                } else if (r.error) {
                    d.error = r.error;
                    d.offline = false;
                    if (r.data) d.data = r.data; // 回源失败但有旧缓存则保留
                }
            });
        }

        // 手动刷新：先立即展示数据库缓存（秒级，不白屏等待），再后台回源抓取最新
        async function refreshAll() {
            const ind = $('refreshIndicator');
            ind.innerHTML = '刷新中 <span class="spin-icon">⟳</span>';
            // 先读数据库缓存秒显（poller 已在后台持续更新）
            try { await pollData(0); } catch (e) {}
            // 再后台回源
            try {
                const result = await apiCall('refresh');
                applyServerData(result);
            } catch (e) {
                showToast('⚠ 刷新失败: ' + e.message);
            } finally {
                renderAll();
                setTimeout(() => { ind.innerHTML = ''; }, 1500);
            }
        }

        // 自动轮询：从数据库读缓存（ttl 内命中，低延迟；过期才回源）
        async function pollData(ttl) {
            try {
                const result = await apiCall('data', { ttl });
                applyServerData(result);
                // 局部更新卡片，避免整页闪烁
                devices.forEach(d => {
                    const card = $('card-' + d.id);
                    if (card) card.outerHTML = renderDeviceCard(d);
                });
                renderStats();
            } catch (e) { /* 轮询瞬时失败忽略 */ }
        }

        // 单台设备刷新（管理列表🔄按钮）：后端 refresh 抓取全部，这里取该设备结果
        async function fetchDevice(dev) {
            try {
                const result = await apiCall('refresh');
                applyServerData(result);
                renderAll();
            } catch (e) {
                showToast('⚠ 刷新失败: ' + e.message);
            }
        }

        // ===== 自动刷新定时器（受下拉框控制） =====
        let refreshTimer = null;
        let refreshMode = 30; // 5 / 30 / 0(手动)
        function setupAutoRefresh() {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
            if (refreshMode === 0) return; // 手动模式不自动轮询
            refreshTimer = setInterval(() => {
                if (document.visibilityState === 'hidden') return;
                // 短信弹窗打开时不刷新，避免覆盖正在编辑的短信内容
                if ($('smsModal').classList.contains('active')) return;
                pollData(refreshMode);
            }, refreshMode * 1000);
        }
        function onRefreshModeChange() {
            refreshMode = parseInt($('refreshMode').value, 10) || 0;
            setupAutoRefresh();
            showToast('已切换为：' + (refreshMode === 0 ? '手动刷新' : refreshMode + '秒自动刷新'));
        }

        // ===== 统计卡片 =====
        function renderStats() {
            const total = devices.length;
            const online = devices.filter(d => d.data && !d.error && !d.offline).length;
            const error = devices.filter(d => d.error && !d.offline).length;
            const offline = devices.filter(d => d.offline || (!d.data && !d.error)).length;
            const withSim = devices.filter(d => d.data && d.data.sim && d.data.sim.present).length;

            $('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">设备总数</div>
                    <div class="stat-value">${total}</div>
                    <div class="stat-sub">已配置 ${total} 台</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">在线（API 正常）</div>
                    <div class="stat-value green">${online}</div>
                    <div class="stat-sub">可管理 ${online} 台</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">离线 / 异常</div>
                    <div class="stat-value ${(error + offline) > 0 ? 'red' : 'yellow'}">${error}<span style="font-size:0.9rem;color:var(--muted)"> / ${offline}</span></div>
                    <div class="stat-sub" style="color:${(error + offline) > 0 ? 'var(--red)' : 'var(--muted)'}">${(error + offline) > 0 ? '⚠ 有设备不可达' : '全部可达'}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">已插 SIM 卡</div>
                    <div class="stat-value accent">${withSim}</div>
                    <div class="stat-sub">共 ${total} 台设备</div>
                </div>
            `;
        }

        // ===== 设备卡片 =====
        function renderDeviceCard(dev) {
            const d = dev.data;
            const isOffline = !!dev.offline;
            const isError = !!dev.error && !isOffline;
            const isOnline = !!d && !isError && !isOffline;

            // 网络
            const net = d && d.network;
            const carrier = carrierInfo(d);
            const sim = d && d.sim;
            // 附加状态
            const dataConn = d && d.dataConn;
            const roaming = d && d.roaming;
            const airplane = d && d.airplane;
            const ota = d && d.ota;
            const stats = d && d.stats;
            const deviceInfo = d && d.device;
            const cpu = stats && stats.cpu_load ? stats.cpu_load.load_percent : null;
            const mem = stats && stats.memory ? stats.memory.used_percent : null;
            const temp = stats && stats.temperature && stats.temperature[0] ? stats.temperature[0].temperature : null;
            const signal = net ? net.signal_strength : null;
            const uptimeSec = stats && stats.uptime ? stats.uptime.uptime_seconds : null;

            const statusCls = isError ? 'status-error' : isOnline ? 'status-online' : 'status-offline';
            const statusTxt = isError ? '连接失败' : isOnline ? '在线' : '离线';

            return `
            <div class="device-card ${isError ? 'error-card' : ''} ${expandedCards.has(dev.id) ? 'expanded' : ''}" id="card-${dev.id}">
                <div class="dev-head" onclick="toggleCard('${dev.id}')">
                    <div class="dev-avatar ${isError ? 'error' : !isOnline ? 'offline' : (carrier ? 'carrier ' + carrier.cls : '')}">${isError ? '⚠️' : !isOnline ? '📡' : (carrier ? carrierLogo(carrier) : '📡')}</div>
                    <div class="dev-id">
                        <div class="dev-name">${esc(dev.name)}</div>
                        <div class="dev-url">${esc(dev.url)}</div>
                        ${isError ? `<div class="dev-summary"><span class="s-op" style="color:var(--red)">连接失败 · 点击展开</span></div>`
                          : !isOnline ? `<div class="dev-summary"><span class="s-op">离线 · 点击展开</span></div>`
                          : `<div class="dev-summary">
                                <span class="s-op">${esc(net ? net.operator_name || '未知运营商' : '—')}</span>
                                <span class="s-sep">·</span>
                                ${signalBars(signal)}
                                ${(() => { const c = connChip(d); return c ? `<span class="s-sep">·</span>${c}` : ''; })()}
                                ${(() => { const v = volteShort(d.volte); return v ? `<span class="s-sep">·</span>${v}` : ''; })()}
                                ${countUnreadSms(dev) > 0 ? `<span class="s-unread">💬 ${countUnreadSms(dev)}</span>` : ''}
                                ${(() => { if (roaming == null) return false; return roaming.is_roaming || roaming.roaming === true || (net && /roaming/i.test(String(net.registration_status || ''))); })() ? `<span class="s-roam">🌐 漫游</span>` : ''}
                             </div>`}
                    </div>
                    <div class="dev-status">
                        <span class="status-badge ${statusCls}">${statusTxt}</span>
                        ${dev.lastUpdate ? `<span style="font-size:0.68rem;color:var(--muted)">${dev.lastUpdate.toLocaleTimeString()}</span>` : ''}
                    </div>
                    <span class="dev-chevron">▾</span>
                </div>
                <div class="dev-body">
                    ${isError ? `
                        <div class="kv-row"><span class="k">错误信息</span><span class="v" style="color:var(--red)">${esc(dev.error)}</span></div>
                        <div class="kv-row"><span class="k">提示</span><span class="v">检查地址、端口、密码</span></div>
                    ` : !d ? `
                        <div class="kv-row"><span class="k">状态</span><span class="v">${dev.loading ? '加载中...' : (isOffline ? '设备离线（无缓存数据）' : '未获取')}</span></div>
                    ` : `\n
                        ${ota && ota.pending_update ? `<div class="ota-banner">📦 固件更新可用：${esc(ota.pending_meta && ota.pending_meta.version || '')} <a class="btn" style="padding:2px 10px;font-size:0.7rem" href="${dev.url}" target="_blank" rel="noopener">去更新</a></div>` : ''}
                        <div class="kv-row"><span class="k">固件版本</span><span class="v mono">${esc(d.version || (deviceInfo && deviceInfo.revision) || '—')}</span></div>
                        <div class="kv-row"><span class="k">型号 / IMEI</span><span class="v mono">${esc(deviceInfo ? (deviceInfo.model || '—') + ' / ' + (deviceInfo.imei || '—') : '—')}</span></div>
                        <div class="kv-row"><span class="k">SIM 卡</span><span class="v">${sim && sim.present ? esc((sim.phone_numbers && sim.phone_numbers[0]) || sim.iccid || '已插卡') : '未插卡 / 无 SIM'}</span></div>
                        <div class="kv-row"><span class="k">运营商</span><span class="v">${esc(net ? net.operator_name || '—' : '—')}</span></div>
                        <div class="kv-row">
                            <span class="k">信号强度</span>
                            <span class="v">${signalBars(signal)}</span>
                        </div>
                        <div class="kv-row"><span class="k">注册状态</span><span class="v">${esc(regLabel(net ? net.registration_status : null))}</span></div>
                        <div class="kv-row">
                            <span class="k">数据连接</span>
                            <span class="v">${dataConn ? (dataConn.active ? '<span class="status-badge status-online">已开启</span>' : '<span class="status-badge status-offline">已关闭</span>') : '—'}</span>
                        </div>
                        <div class="kv-row">
                            <span class="k">漫游 / 飞行</span>
                            <span class="v">
                                ${(() => {
                                    if (roaming == null) return '<span class="status-badge status-offline">未知</span>';
                                    const on = roaming.is_roaming || roaming.roaming === true
                                        || (net && /roaming/i.test(String(net.registration_status || '')));
                                    return on
                                        ? '<span class="status-badge status-warning">漫游中</span>'
                                        : '<span class="status-badge status-offline">未漫游</span>';
                                })()}
                                ${airplane && airplane.enabled ? '<span class="status-badge status-error">飞行模式</span>' : ''}
                            </span>
                        </div>
                        <div class="kv-row">
                            <span class="k">VoLTE</span>
                            <span class="v">${volteBadge(dev, d.volte)}</span>
                        </div>
                        <div class="kv-row"><span class="k">运行时长</span><span class="v">${fmtUptime(uptimeSec)}</span></div>
                        <div class="kv-row"><span class="k">温度</span><span class="v">${temp != null ? temp.toFixed(1) + '°C' : '—'}</span></div>
                        <div class="kv-row">
                            <span class="k">CPU 负载</span>
                            <span class="v" style="width:45%">
                                ${cpu != null ? cpu.toFixed(0) + '%' : '—'}
                                <div class="meter cpu"><div style="width:${cpu || 0}%"></div></div>
                            </span>
                        </div>
                        <div class="kv-row">
                            <span class="k">内存</span>
                            <span class="v" style="width:45%">
                                ${mem != null ? mem.toFixed(0) + '%' : '—'}
                                <div class="meter mem"><div style="width:${mem || 0}%"></div></div>
                            </span>
                        </div>
                    `}
                </div>
                <div class="ctrl-panel" id="ctrl-${dev.id}">${isOnline ? `
                    <div class="ctrl-group">
                        <div class="ctrl-label">⚡ 快捷控制</div>
                        <span class="ctrl-item ${dataConn && dataConn.active ? 'on' : 'off'}" id="ctrl-dc-${dev.id}" onclick="toggleCtrl('${dev.id}','data','${dataConn && dataConn.active ? 'false' : 'true'}')">
                            <span class="dot"></span>数据连接
                        </span>
                        <span class="ctrl-item ${roaming && roaming.roaming_allowed ? 'on' : 'off'}" id="ctrl-rm-${dev.id}" onclick="toggleCtrl('${dev.id}','roaming','${roaming && roaming.roaming_allowed ? 'false' : 'true'}')">
                            <span class="dot"></span>漫游
                        </span>
                        <span class="ctrl-item ${airplane && airplane.enabled ? 'on' : 'off'}" id="ctrl-ap-${dev.id}" onclick="toggleCtrl('${dev.id}','airplane','${airplane && airplane.enabled ? 'false' : 'true'}')">
                            <span class="dot"></span>飞行模式
                        </span>
                        <button class="ctrl-btn" onclick="ctrlAction('${dev.id}','baseband')" title="重启基带">📡 重启基带</button>
                        <button class="ctrl-btn danger" onclick="ctrlAction('${dev.id}','reboot')" title="⚠ 重启系统">🔁 重启系统</button>
                    </div>` : ''}
                </div>
                <div class="dev-actions">
                    <button class="btn" onclick="fetchDevice(findDev('${dev.id}'))">🔄 刷新</button>
                    <button class="btn ${countUnreadSms(dev) > 0 ? 'btn-sms-unread' : ''}" onclick="openSms('${encodeURIComponent(dev.url)}')">${smsBtnHtml(dev)}</button>
                    <a class="btn" href="${dev.url}" target="_blank" rel="noopener">🌐 Web UI</a>
                    <button class="btn btn-danger" onclick="confirmRemoveDevice('${dev.id}')">🗑️</button>
                </div>
            </div>`;
        }

        // 卡片展开/收起状态：默认收起，点击卡片头部展开显示具体数据
        const expandedCards = new Set();
        function toggleCard(id) {
            if (expandedCards.has(id)) expandedCards.delete(id);
            else expandedCards.add(id);
            const card = document.getElementById('card-' + id);
            if (card) card.classList.toggle('expanded', expandedCards.has(id));
        }

        function renderGrid() {
            const grid = $('deviceGrid');
            $('listHint').textContent = devices.length ? `${devices.length} 台设备 · 点击「刷新全部」或单卡刷新拉取状态` : '';
            if (devices.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1">
                        <div class="big">📭</div>
                        <div>还没有配置设备</div>
                        <div style="margin-top:12px"><button class="btn btn-primary" onclick="openAddDevice()">＋ 添加第一台设备</button></div>
                    </div>`;
                return;
            }
            grid.innerHTML = devices.map(renderDeviceCard).join('');
        }

        function renderAll() {
            renderStats();
            renderGrid();
        }

        function findDev(id) { return devices.find(d => d.id === id); }

        // ===== 短信 =====
        let smsDevId = null;      // 当前短信弹窗对应的设备

        // --- 已读记录（localStorage 缓存 + 服务器同步，跨设备共享已读状态） ---
        function loadSeenSms() {
            try { return JSON.parse(localStorage.getItem(SMS_SEEN_KEY)) || {}; } catch (e) { return {}; }
        }
        function seenSmsMaxId(devId) {
            return loadSeenSms()[devId] || 0;
        }
        function markSmsSeen(devId, maxId) {
            const seen = loadSeenSms();
            seen[devId] = Math.max(seen[devId] || 0, maxId || 0);
            localStorage.setItem(SMS_SEEN_KEY, JSON.stringify(seen));
            // 同步到服务器（跨设备：A 端已读，B 端不再提醒）
            fetch('api.php?action=sms-seen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seen: { [devId]: seen[devId] }, ...(accessPassword ? { access_password: accessPassword } : {}) })
            }).catch(() => {});
        }
        // 启动时从服务器拉取已读记录并合并（取较大值，不覆盖本地新记录）
        async function syncSeenSmsFromServer() {
            try {
                const res = await fetchWithTimeout('api.php?action=sms-seen' + (accessPassword ? '&access_password=' + encodeURIComponent(accessPassword) : ''));
                const json = await res.json().catch(() => null);
                if (json && json.status === 'ok' && json.data && typeof json.data === 'object') {
                    const seen = loadSeenSms();
                    let changed = false;
                    for (const [devId, maxId] of Object.entries(json.data)) {
                        if ((seen[devId] || 0) < maxId) { seen[devId] = maxId; changed = true; }
                    }
                    if (changed) localStorage.setItem(SMS_SEEN_KEY, JSON.stringify(seen));
                }
            } catch (e) { /* 服务器不可用时用本地 */ }
        }
        // 未读统计（仅 incoming 且 id > 已读记录）
        function countUnreadSms(dev) {
            const msgs = dev.smsMsgs || [];
            const seen = seenSmsMaxId(dev.id);
            return msgs.filter(m => m.direction === 'incoming' && m.id > seen).length;
        }
        // 短信按钮未读数字（0 时不显示）
        function smsBtnHtml(dev) {
            const n = countUnreadSms(dev);
            if (n <= 0) return '💬 短信';
            return `💬 短信 <b class="sms-badge-num">${n}</b>`;
        }

        // --- 拉取短信（唯一入口：更新数据 + 角标；弹窗打开时同步刷新面板） ---
        async function refreshSms(dev, { markRead = false, panel = false } = {}) {
            try {
                const data = await apiGet(dev, '/api/sms/list?limit=50&offset=0');
                const msgs = (data && data.messages) || [];
                dev.data = dev.data || {};
                dev.smsMsgs = msgs;
                if (markRead) {
                    const maxIncoming = msgs
                        .filter(m => m.direction === 'incoming')
                        .reduce((mx, m) => Math.max(mx, m.id || 0), 0);
                    markSmsSeen(dev.id, maxIncoming);
                }
                if (panel && smsDevId === dev.id && $('smsModal').classList.contains('active')) {
                    renderSmsPanel(dev);
                }
                renderAll();
                return msgs;
            } catch (e) {
                return [];
            }
        }

        // --- 弹窗面板渲染（聊天视图：旧→新，最新在底部） ---
        function renderSmsPanel(dev) {
            const body = $('smsBody');
            const msgs = dev.smsMsgs || [];
            // 保留正在编辑的回复框内容，避免后台刷新 / 重渲染时清空用户输入
            const numEl = document.getElementById('smsReplyNum');
            const contentEl = document.getElementById('smsReplyContent');
            const savedNum = numEl ? numEl.value : '';
            const savedContent = contentEl ? contentEl.value : '';
            if (!msgs.length) {
                body.innerHTML = `<div class="sms-empty">📭 暂无短信</div>` + replyBoxHtml(dev);
            } else {
                const sorted = [...msgs].reverse(); // DESC → ASC，新的在底部
                const items = sorted.map(m => {
                    const incoming = m.direction === 'incoming';
                    const cls = incoming ? 'incoming' : 'outgoing';
                    const unread = incoming && m.id > seenSmsMaxId(dev.id);
                    return `
                        <div class="sms-msg ${cls} ${unread ? 'unread' : ''}">
                            <div class="bubble">
                                <div class="meta">
                                    <span class="num">${esc(m.phone_number || '—')}</span>
                                    <span>${fmtSmsTime(m.timestamp)}</span>
                                </div>
                                <div>${esc(m.content || '')}</div>
                            </div>
                        </div>`;
                }).join('');
                body.innerHTML = `<div class="sms-list">${items}</div>` + replyBoxHtml(dev);
            }
            // 恢复用户输入
            const n = document.getElementById('smsReplyNum');
            const c = document.getElementById('smsReplyContent');
            if (n && savedNum) n.value = savedNum;
            if (c && savedContent) c.value = savedContent;
            // 最新消息滚到底部
            const list = body.querySelector('.sms-list');
            if (list) list.scrollTop = list.scrollHeight;
        }

        // 时间格式化：今天→HH:MM，昨天→昨天 HH:MM，更早→MM-DD HH:MM
        function fmtSmsTime(ts) {
            if (!ts) return '';
            const d = new Date(String(ts).replace(' ', 'T'));
            if (isNaN(d.getTime())) return esc(ts);
            const now = new Date();
            const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const sameDay = d.toDateString() === now.toDateString();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            if (sameDay) return hm;
            if (d.toDateString() === yest.toDateString()) return `昨天 ${hm}`;
            return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${hm}`;
        }

        function replyBoxHtml(dev) {
            return `
                <div class="sms-reply-box">
                    <input type="text" id="smsReplyNum" placeholder="收件号码" value="">
                    <textarea id="smsReplyContent" placeholder="输入回复内容..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendSms('${dev.id}')}"></textarea>
                    <button class="btn btn-primary" onclick="sendSms('${dev.id}')">发送</button>
                </div>`;
        }

        // --- 发送短信 ---
        async function sendSms(devId) {
            const dev = findDev(devId);
            if (!dev) return;
            const num = $('smsReplyNum').value.trim();
            const content = $('smsReplyContent').value.trim();
            if (!num || !content) { showToast('⚠ 号码和内容必填'); return; }
            try {
                const res = await fetch('api.php?action=action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: dev.url, path: '/api/sms/send', body: { phone_number: num, content }, ...(accessPassword ? { access_password: accessPassword } : {}) })
                });
                const json = await res.json().catch(() => null);
                if (!json || json.status !== 'ok') {
                    throw new Error((json && json.message) || '发送失败');
                }
                showToast(`✅ 已发送给 ${num}`);
                $('smsReplyContent').value = '';
                // 乐观插入一条 outgoing（立即显示，避免等轮询）
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const ts = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                const msgs = dev.smsMsgs || [];
                dev.smsMsgs = [{ id: Date.now(), direction: 'outgoing', phone_number: num, content, timestamp: ts, status: 'sent' }, ...msgs];
                renderSmsPanel(dev);
                renderAll();
                // 后台重新拉取对齐真实数据
                refreshSms(dev, { panel: true });
            } catch (e) {
                showToast('❌ ' + (e.message || e));
            }
        }

        // --- 打开/关闭弹窗 ---
        async function openSms(urlEnc) {
            // 用 url 定位设备：删除+重加后设备 id 会变，但 url 稳定，
            // 因此按钮按 url 查找可避免「重加后点击无反应」的问题
            const url = decodeURIComponent(urlEnc);
            const dev = devices.find(d => d.url === url);
            if (!dev) return;
            smsDevId = dev.id;
            $('smsTitle').textContent = `💬 短信 · ${dev.name}`;
            openModal('smsModal');
            // 1) 立即渲染内存中已由轮询器缓存的短信（0 延迟；poller 每 5 秒写入库）
            if (dev.smsMsgs && dev.smsMsgs.length) {
                renderSmsPanel(dev);
            } else {
                $('smsBody').innerHTML = '<div class="sms-empty">加载中...</div>';
                // 缓存为空（如手动模式 / 刚打开页面）时，快速从后端数据库读一次
                // （ttl=0 仅读库、不直连设备，低延迟），直接加载到本设备
                try {
                    const result = await apiCall('data', { ttl: 0 });
                    const r = result && result[dev.id];
                    if (r && r.ok && r.data && r.data.sms && Array.isArray(r.data.sms)) {
                        dev.smsMsgs = r.data.sms; // 直接加载，绕过 applyServerData 的弹窗守卫
                        renderSmsPanel(dev);
                    }
                } catch (e) { /* 失败则等后台实时拉取 */ }
            }
            // 2) 后台直连设备拉取最新并标记已读（不阻塞显示）
            refreshSms(dev, { markRead: true, panel: true });
        }

        // 关闭弹窗（含 Esc 与点遮罩）时清空当前设备
        function closeSmsModal() {
            $('smsModal').classList.remove('active');
            smsDevId = null;
        }

        // ===== 设备操作 =====
        // 快捷控制：开关切换
        async function toggleCtrl(id, type, val) {
            const dev = findDev(id);
            if (!dev) return;
            const el = $(`ctrl-${type}-${id}`);
            if (el) el.classList.add('loading');
            const paths = { data: '/api/data', roaming: '/api/roaming', airplane: '/api/airplane-mode' };
            const bodies = { data: { active: val === 'true' }, roaming: { allowed: val === 'true' }, airplane: { enabled: val === 'true' } };
            const path = paths[type];
            const body = bodies[type];
            if (!path || !body) return;
            try {
                const res = await fetch('api.php?action=action', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: dev.url, path, body })
                });
                const json = await res.json();
                if (json && json.status === 'ok') {
                    showToast(`✅ ${type === 'data' ? '数据连接' : type === 'roaming' ? '漫游' : '飞行模式'}已${val === 'true' ? '开启' : '关闭'}`);
                    // 更新本地状态并刷新
                    if (dev.data) {
                        if (type === 'data') dev.data.dataConn = { active: val === 'true' };
                        else if (type === 'roaming') dev.data.roaming = { ...dev.data.roaming, roaming_allowed: val === 'true' };
                        else if (type === 'airplane') dev.data.airplane = { ...dev.data.airplane, enabled: val === 'true' };
                    }
                    renderAll();
                } else {
                    showToast('⚠ ' + ((json && json.message) || '操作失败'));
                }
            } catch (e) {
                showToast('⚠ 操作失败: ' + e.message);
            } finally {
                if (el) el.classList.remove('loading');
            }
        }
        // 快捷控制：按钮操作（重启基带/系统）
        async function ctrlAction(id, type) {
            const dev = findDev(id);
            if (!dev) return;
            const confirmMsg = type === 'reboot' ? '⚠ 确定要重启该设备系统吗？' : null;
            if (confirmMsg && !confirm(confirmMsg)) return;
            const paths = { baseband: '/api/baseband/restart', reboot: '/api/system/reboot' };
            const bodies = { baseband: {}, reboot: { delay_seconds: 1 } };
            const path = paths[type];
            const body = bodies[type];
            if (!path) return;
            try {
                showToast(`⏳ 正在${type === 'baseband' ? '重启基带' : '重启系统'}...`);
                const res = await fetch('api.php?action=action', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: dev.url, path, body })
                });
                const json = await res.json();
                if (json && json.status === 'ok') {
                    showToast(`✅ ${type === 'baseband' ? '基带重启已触发' : '系统重启已触发'}`);
                } else {
                    showToast('⚠ ' + ((json && json.message) || '操作失败'));
                }
            } catch (e) {
                showToast('⚠ 操作失败: ' + e.message);
            }
        }
        async function confirmRemoveDevice(id) {
            const dev = findDev(id);
            if (!dev) return;
            if (!confirm(`确定移除设备「${dev.name}」吗？`)) return;
            devices = devices.filter(d => d.id !== id);
            await saveDevices();
            renderAll();
            showToast(`已移除「${dev.name}」`);
        }

        // ===== 添加设备 =====
        function openAddDevice() {
            $('addName').value = '';
            $('addIp').value = '';
            $('addPassword').value = '';
            openModal('addModal');
        }
        async function confirmAddDevice() {
            const name = $('addName').value.trim();
            const ip = $('addIp').value.trim();
            const password = $('addPassword').value; // 可留空：设备未开密码验证
            if (!name || !ip) {
                showToast('⚠ 名称、IP 必填');
                return;
            }
            let url;
            try {
                url = normalizeUrl(ip);
            } catch (e) {
                showToast('⚠ IP 地址格式不正确');
                return;
            }
            devices.push({
                id: 'dev_' + Date.now().toString(36),
                name, url, password,
                data: null, error: null, loading: false, lastUpdate: null, smsMsgs: []
            });
            await saveDevices(); // 先确保后端 devices 表已写入新设备，再刷新拉数据
            closeModal('addModal');
            renderAll();
            refreshAll(); // 后端回源抓取（含新设备），写库后前端读取
            showToast(password
                ? `✅ 已添加「${name}」（${url}），已启用密码验证`
                : `✅ 已添加「${name}」（${url}），未设密码（设备未开验证）`);
        }

        // ===== 管理设备列表 =====
        function openManageDevices() {
            $('manageList').innerHTML = devices.length ? devices.map(d => `
                <div class="device-list-item">
                    <span class="name">${esc(d.name)}</span>
                    <span class="addr">${esc(d.url)}</span>
                    <span class="actions">
                        <button class="btn" style="padding:4px 10px" onclick="fetchDevice(findDev('${d.id}'));closeModal('manageModal')">🔄</button>
                        <button class="btn btn-danger" style="padding:4px 10px" onclick="confirmRemoveDevice('${d.id}')">🗑️</button>
                    </span>
                </div>
            `).join('') : '<div style="color:var(--muted);text-align:center;padding:20px">暂无设备</div>';
            openModal('manageModal');
        }

        // ===== 弹窗 =====
        function openModal(id) { $(id).classList.add('active'); }
        function closeModal(id) {
            $(id).classList.remove('active');
            if (id === 'smsModal') smsDevId = null; // 关闭短信弹窗时清空当前设备
        }
        document.querySelectorAll('.modal-overlay').forEach(ov => {
            ov.addEventListener('click', e => {
                // 主密码弹窗不可点击遮罩关闭（必须输入正确密码）
                if (e.target === ov && ov.id !== 'authModal') closeModal(ov.id);
            });
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                // 主密码弹窗打开时不可 Esc 关闭（必须输入正确密码）
                if ($('authModal').classList.contains('active')) return;
                document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m.id));
            }
        });

        // ===== 主密码（首次设置 / 登录） =====
        let authNeedsSetup = false; // 服务器尚未设置主密码
        function openAuthModal() {
            // 关闭其他弹窗，只保留主密码弹窗（防止绕过）
            document.querySelectorAll('.modal-overlay.active').forEach(m => {
                if (m.id !== 'authModal') closeModal(m.id);
            });
            $('authTitle').textContent = authNeedsSetup ? '🔒 首次设置访问密码' : '🔒 输入访问密码';
            $('authLabel').textContent = authNeedsSetup ? '设置访问密码（至少 4 位）' : '输入访问密码';
            $('authTip').textContent = authNeedsSetup
                ? '首次部署，请设置一个访问密码保护管理页面（设备密码会保存在服务器，需访问密码保护）'
                : '页面已被访问密码保护';
            $('authInput').value = '';
            openModal('authModal');
            setTimeout(() => $('authInput').focus(), 50);
        }
        async function submitAuth() {
            const pw = $('authInput').value.trim();
            if (!pw) { showToast('⚠ 请输入密码'); return; }
            try {
                if (authNeedsSetup) {
                    const res = await fetch('api.php?action=setup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ access_password: pw })
                    });
                    const json = await res.json().catch(() => null);
                    if (!json || json.status !== 'ok') {
                        // setup 被拒绝（如另一台设备已设置过主密码）→ 自动切换为登录模式
                        if (json && json.message && json.message.includes('已设置')) {
                            authNeedsSetup = false;
                            $('authTitle').textContent = '🔒 输入访问密码';
                            $('authLabel').textContent = '输入访问密码';
                            $('authTip').textContent = '主密码已在其他设备上设置，请输入已有密码';
                            $('authInput').value = '';
                            showToast('⚠ 主密码已被设置，请输入已有密码');
                            return;
                        }
                        showToast('⚠ ' + ((json && json.message) || '设置失败'));
                        return;
                    }
                    authNeedsSetup = false;
                } else {
                    // 登录模式：先用输入的主密码验证（调 devices 接口），失败则拒绝进入
                    try {
                        const res = await fetch('api.php?action=devices&access_password=' + encodeURIComponent(pw));
                        const json = await res.json().catch(() => null);
                        if (!json || json.status !== 'ok') {
                            showToast('⚠ 主密码错误，请重试');
                            return; // 不关闭弹窗
                        }
                    } catch (e) {
                        showToast('⚠ 验证失败，请重试');
                        return;
                    }
                }
                setAccessPassword(pw);
                closeModal('authModal');
                showToast('✅ 已进入管理页面');
                initAfterAuth();
            } catch (e) {
                showToast('⚠ 密码错误或网络错误');
            }
        }

        // ===== 初始化 =====
        renderAll();
        async function initAfterAuth() {
            // 设备列表是渲染前提：先取列表 → 建卡片 → 立刻读库秒显数据
            // （poller 在后台每 5 秒持续写库，action=data 只读缓存，理论 <1s 出数据）
            syncDevicesFromServer()
                .then(() => { renderAll(); })
                .catch(() => {})
                .finally(() => { pollData(refreshMode || 30); });
            // 已读短信记录后台同步，不阻塞数据展示
            syncSeenSmsFromServer().catch(() => {});
        }
        // 检查鉴权状态：未设主密码→弹设置；已设但本端没密码→弹输入；已通过→直接初始化
        (async () => {
            try {
                const res = await fetchWithTimeout('api.php?action=health');
                const json = await res.json().catch(() => null);
                if (json && json.status === 'ok') {
                    authNeedsSetup = !json.data.access_protected;
                    if (authNeedsSetup || !accessPassword) {
                        openAuthModal();
                    } else {
                        initAfterAuth();
                    }
                } else {
                    initAfterAuth();
                }
            } catch (e) {
                initAfterAuth();
            }
        })();
        // 短信刷新说明：
        // 短信列表 / 未读角标改由后端 poller.php 每 5 秒写入 SQLite 缓存，前端通过 pollData() 读库更新角标（低延迟、不直连设备）。
        // 短信弹窗仅在「打开 / 发送 / 标记已读」时主动刷新（见 openSms / sendSms / refreshSms），
        // 不再有任何定时轮询去刷新弹窗，因此编辑短信时不会被刷新覆盖、已输入内容不会丢失。
        // （旧逻辑：每 10 秒直连设备刷新短信面板 —— 已移除，它会导致手动模式仍在刷新、且会清空正在编辑的短信内容。）
        // 设备状态自动刷新：由顶部下拉框控制（5秒/30秒/手动），数据从数据库读取（低延迟）
        setupAutoRefresh();
    </script>
</body>
</html>
